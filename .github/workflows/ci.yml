name: CI

on:
  pull_request:
    branches: [dev, staging, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Unit tests and data checks
        run: uv run pytest

      - name: Smoke run on committed sample (prepare, train, evaluate)
        run: |
          uv run python -m src.prepare --input-path tests/fixtures/sample_housing.csv --train-path "$RUNNER_TEMP/train.csv" --test-path "$RUNNER_TEMP/test.csv"
          uv run python -m src.modeling.train --train-path "$RUNNER_TEMP/train.csv" --model-path "$RUNNER_TEMP/model.joblib"
          uv run python -m src.modeling.evaluate --test-path "$RUNNER_TEMP/test.csv" --model-path "$RUNNER_TEMP/model.joblib" --metrics-path "$RUNNER_TEMP/metrics.json"
