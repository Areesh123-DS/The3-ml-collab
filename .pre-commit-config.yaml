repos:
  # Lint + format (PDF: "ruff (lint + format)")
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Strip notebook outputs (PDF: "nbstripout")
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  # Block files over 1 MB (PDF: "check-added-large-files (limit 1 MB)")
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  # Secret scanner (PDF: "detect-secrets or gitleaks")
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^uv\.lock$|\.dvc$|^dvc\.lock$